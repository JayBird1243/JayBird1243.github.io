<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard • Prompts</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="icon" type="image/png" href="/images/Site Logo.png">
  <link rel="shortcut icon" type="image/png" href="/images/Site Logo.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Orbitron:wght@700;900&family=Rajdhani:wght@500;600;700&family=Source+Code+Pro:wght@400;600&display=swap" rel="stylesheet">
  <!-- Font Awesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* Design Spec Overrides */
    :root {
      --bg-dark-spec: #050505;
      --card-bg-spec: rgba(20, 20, 20, 0.6);
      --card-border-spec: rgba(255, 255, 255, 0.05);
      --electric-blue: #00BFFF;
      --magenta: #FF00FF;
      --lime: #32CD32;
    }

    body {
      background-color: var(--bg-dark-spec);
      font-family: 'Inter', sans-serif;
    }

    h1, h2, h3 {
      font-family: 'Orbitron', sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    h4, h5, .card-title {
      font-family: 'Rajdhani', sans-serif;
    }

    .font-tech {
      font-family: 'Source Code Pro', monospace;
    }

    /* Glass Card Spec */
    .glass-card-spec {
      background: var(--card-bg-spec);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--card-border-spec);
      border-radius: 1.5rem; /* 24px */
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }

    .glass-card-spec:hover {
      transform: translateY(-2px) scale(1.005);
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      border-color: rgba(255, 255, 255, 0.1);
    }

    /* Mouse Spotlight Effect */
    .glass-card-spec::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: radial-gradient(600px circle at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(255,255,255,0.06), transparent 40%);
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
      z-index: 1;
    }
    .glass-card-spec:hover::before {
      opacity: 1;
    }

    /* Background Decor */
    .bg-decor-glow {
      position: fixed;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      filter: blur(100px);
      z-index: -1;
      opacity: 0.15;
      pointer-events: none;
    }
    .bg-glow-tl { top: -200px; left: -200px; background: var(--electric-blue); }
    .bg-glow-br { bottom: -200px; right: -200px; background: var(--magenta); }

    /* Custom Button */
    .btn-spec {
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      background: rgba(0, 191, 255, 0.1);
      border: 1px solid var(--electric-blue);
      color: var(--electric-blue);
      box-shadow: 0 0 10px rgba(0, 191, 255, 0.2);
      transition: all 0.3s ease;
    }
    .btn-spec:hover {
      background: var(--electric-blue);
      color: #000;
      box-shadow: 0 0 20px rgba(0, 191, 255, 0.6);
    }

    /* Layout tweaks */
    .vertical-stack {
      display: flex;
      flex-direction: column;
      gap: 1.5rem; /* 24px */
    }
  </style>
</head>
<body class="min-h-screen text-gray-200 overflow-x-hidden selection:bg-electric-blue selection:text-black">
  <div class="bg-decor-glow bg-glow-tl"></div>
  <div class="bg-decor-glow bg-glow-br"></div>

  <!-- Navbar handled by navbar.js -->
  <script type="module" src="/js/navbar.js"></script>

  <main class="pt-28 pb-12 px-6 lg:px-12 max-w-[1200px] mx-auto">
    <div class="space-y-8">
      <!-- Header Section -->
      <div class="glass-card-spec p-8 flex flex-col md:flex-row items-start md:items-center justify-between gap-6 relative overflow-visible">
        <!-- Decorative colored orb behind header -->
        <div class="absolute -top-20 -left-20 w-64 h-64 bg-magenta/20 rounded-full blur-[80px] pointer-events-none"></div>

        <div class="relative z-10">
          <div class="flex items-center gap-3 mb-2">
            <span class="px-2 py-0.5 rounded text-[10px] font-['Source_Code_Pro'] bg-magenta/10 text-magenta border border-magenta/20">MODULE ACTIVE</span>
            <span class="px-2 py-0.5 rounded text-[10px] font-['Source_Code_Pro'] bg-gray-800 text-gray-400 border border-gray-700">v1.0</span>
          </div>
          <h1 class="text-4xl font-black text-white tracking-tight mb-2">AI Prompts</h1>
          <p class="text-gray-400 font-['Rajdhani'] text-lg max-w-xl">Configure AI prompts and response schemas for your workflows.</p>
        </div>
        <button id="createPromptBtn" class="btn-spec px-8 py-3 rounded-lg flex items-center gap-3 relative z-10 group">
          <i class="fa-solid fa-plus text-lg group-hover:rotate-90 transition-transform duration-300"></i>
          <span>Create New Prompt</span>
        </button>
      </div>

      <!-- Prompts List (Single Column Stack) -->
      <div id="promptsGrid" class="flex flex-col gap-4">
        <!-- Prompt rows will be inserted here -->
      </div>

      <!-- Loading State -->
      <div id="loadingState" class="glass-card-spec p-12 text-center">
        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-electric-blue mx-auto"></div>
        <p class="text-gray-400 mt-4 font-['Rajdhani']">Loading prompts...</p>
      </div>

      <!-- Empty State -->
      <div id="emptyState" class="glass-card-spec p-16 hidden flex flex-col items-center justify-center text-center">
        <div class="w-24 h-24 rounded-2xl bg-white/5 border border-white/10 flex items-center justify-center mb-6 shadow-[0_0_30px_rgba(0,0,0,0.5)]">
          <i class="fa-solid fa-robot text-4xl text-gray-600"></i>
        </div>
        <h3 class="text-2xl font-bold text-white mb-2 font-['Rajdhani']">No Prompts Found</h3>
        <p class="text-gray-400 mb-8 max-w-md mx-auto">Create your first AI prompt to get started with content generation.</p>
        <button id="emptyStateCreateBtn" class="px-6 py-2 rounded border border-gray-700 hover:border-gray-500 text-gray-300 hover:text-white transition-all font-['Source_Code_Pro'] text-sm">
          Initialize Prompt >
        </button>
      </div>
    </div>
  </main>

  <!-- Firebase & Main Scripts -->
  <script type="module">
    import { initializeFirebase } from '/firebase-config.js';
    
    // Initialize Firebase first
    const { auth, firestore } = await initializeFirebase();
    const db = firestore;
    
    // Import Firebase modules
    const { onAuthStateChanged } = window.firebase;
    const { collection, query, getDocs, orderBy } = await import('https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js');

    let currentUser = null;

    // Check authentication
    onAuthStateChanged(auth, (user) => {
      if (!user) {
        window.location.href = '/auth.html';
        return;
      }
      currentUser = user;
      loadPrompts();
      
      // Initialize notifications UI if user is logged in
      const notifScript = document.createElement('script');
      notifScript.src = '/js/notifications-ui.js';
      notifScript.onload = () => {
        if (window.NotificationsUI) {
          const notifUI = new window.NotificationsUI();
          notifUI.initialize(user.uid);
          window.notificationsUI = notifUI;
        }
      };
      document.head.appendChild(notifScript);
    });

    // Create new prompt
    function createNewPrompt() {
      if (!currentUser) return;
      window.location.href = '/dashboard/prompts/builder.html';
    }

    // Load prompts from Firestore
    async function loadPrompts() {
      const loadingState = document.getElementById('loadingState');
      const emptyState = document.getElementById('emptyState');
      const promptsGrid = document.getElementById('promptsGrid');

      try {
        loadingState.classList.remove('hidden');
        emptyState.classList.add('hidden');
        promptsGrid.innerHTML = '';

        const promptsRef = collection(db, `users/${currentUser.uid}/prompts`);
        const q = query(promptsRef, orderBy('createdAt', 'desc'));
        const snapshot = await getDocs(q);

        loadingState.classList.add('hidden');

        if (snapshot.empty) {
          emptyState.classList.remove('hidden');
          return;
        }

        // Render prompt cards
        snapshot.forEach((doc) => {
          const prompt = doc.data();
          const card = createPromptCard(doc.id, prompt);
          promptsGrid.appendChild(card);
        });

      } catch (error) {
        console.error('Error loading prompts:', error);
        loadingState.classList.add('hidden');
        promptsGrid.innerHTML = `
          <div class="col-span-full glass-card-spec p-12 text-center">
            <p class="text-red-400 font-['Source_Code_Pro']">Error loading prompts. Please try again.</p>
          </div>
        `;
      }
    }

    // Create a prompt row element
    function createPromptCard(docId, prompt) {
      const card = document.createElement('div');
      card.className = 'glass-card-spec flex flex-col md:flex-row items-center gap-6 p-6 cursor-pointer group hover:border-magenta/50 transition-colors';
      // Adjust hover transform for rows
      
      // Get response type label
      const responseTypeLabels = {
        'bounded_numeric': 'Bounded Number',
        'unbounded_numeric': 'Number',
        'bounded_string': 'Choice',
        'bounded_multiple_string': 'Multiple Choice',
        'unbounded_string': 'Text'
      };
      const responseLabel = responseTypeLabels[prompt.responseType] || prompt.responseType;

      card.innerHTML = `
        <!-- Icon/Indicator -->
        <div class="hidden md:flex shrink-0 w-12 h-12 rounded-xl bg-magenta/5 border border-magenta/10 items-center justify-center">
           <i class="fa-solid fa-code-branch text-magenta/50 group-hover:text-magenta transition-colors"></i>
        </div>

        <!-- Main Info -->
        <div class="flex-1 min-w-0">
          <div class="flex items-center gap-3 mb-2">
            <h3 class="text-lg font-bold text-white group-hover:text-magenta transition-colors truncate font-['Rajdhani'] tracking-wide">
              ${escapeHtml(prompt.name || 'Untitled Prompt')}
            </h3>
            <span class="px-2 py-0.5 bg-white/5 border border-white/10 text-gray-400 rounded text-[10px] font-['Source_Code_Pro'] uppercase tracking-wider shrink-0">
              ${responseLabel}
            </span>
          </div>
          <p class="text-gray-400 text-sm line-clamp-1 font-['Inter']">
            ${prompt.description ? escapeHtml(prompt.description) : 'No description provided'}
          </p>
        </div>

        <!-- Metadata & Actions -->
        <div class="flex items-center gap-8 w-full md:w-auto justify-between md:justify-end border-t md:border-t-0 border-white/5 pt-4 md:pt-0">
          <div class="text-right hidden md:block">
             <div class="text-[10px] text-gray-500 font-['Source_Code_Pro'] uppercase tracking-wider">Created</div>
             <div class="text-sm text-gray-300 font-['Rajdhani'] font-semibold">
               ${prompt.createdAt ? formatDate(prompt.createdAt) : 'Recently'}
             </div>
          </div>

          <div class="flex items-center gap-4">
             <button class="h-10 px-4 rounded-lg bg-white/5 hover:bg-magenta/10 text-gray-400 hover:text-magenta transition-colors border border-transparent hover:border-magenta/20 font-['Rajdhani'] font-bold text-sm tracking-wide opacity-0 group-hover:opacity-100 transition-all transform translate-x-2 group-hover:translate-x-0">
                EDIT PROMPT
             </button>
             <div class="w-8 h-8 rounded-full bg-white/5 flex items-center justify-center group-hover:bg-magenta group-hover:text-black transition-colors">
                <i class="fa-solid fa-chevron-right text-xs"></i>
             </div>
          </div>
        </div>
      `;

      // Mouse spotlight effect
      card.addEventListener('mousemove', e => {
        const rect = card.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        card.style.setProperty('--mouse-x', `${x}px`);
        card.style.setProperty('--mouse-y', `${y}px`);
      });

      // Navigate to prompt builder on click
      card.addEventListener('click', () => {
        window.location.href = `/dashboard/prompts/builder.html?id=${docId}`;
      });

      return card;
    }

    // Utility function to escape HTML
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Format date for display
    function formatDate(timestamp) {
      if (!timestamp) return '';
      const date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
      return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }

    // Event listeners
    document.getElementById('createPromptBtn').addEventListener('click', createNewPrompt);
    document.getElementById('emptyStateCreateBtn').addEventListener('click', createNewPrompt);
  </script>
</body>
</html>
