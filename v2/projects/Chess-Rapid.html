<!DOCTYPE html>
<html lang="en" data-root="../" data-page="projects">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chess Rapid | Jack Buhr</title>
    <meta name="description" content="A live board of my Chess.com rapid rating, form and games since August 1, 2026.">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230c0f14'/%3E%3Crect x='9' y='9' width='14' height='14' rx='3' fill='%23f0b246'/%3E%3C/svg%3E">
    <script>document.documentElement.classList.add('js')</script>
    <link rel="stylesheet" href="../assets/site.css">
    <script src="../assets/site.js" defer></script>
    <style>
        .chess-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem 1.25rem; margin-top: 1.5rem; }

        .chess-root { display: grid; gap: 1.25rem; }

        /* Loading / error / empty */
        .chess-status {
            display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem 1.25rem;
            min-height: 120px; padding: 1.25rem 1.35rem;
            background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
            color: var(--text-2); font-size: 0.95rem;
        }
        .chess-status p { margin: 0; flex: 1 1 260px; }
        .chess-status .lamp { background: var(--accent); }
        .chess-status--error { border-left: 2px solid var(--bad); border-radius: 0 var(--radius) var(--radius) 0; }

        /* Headline tiles */
        .chess-tiles { padding: 1.15rem 1.25rem; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
        .chess-tiles .stat-num { font-family: var(--mono); font-weight: 500; letter-spacing: -0.01em; }

        /* Panels */
        .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: clamp(0.95rem, 2.4vw, 1.35rem); min-width: 0; }
        .panel-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 0.25rem 1rem; margin-bottom: 0.9rem; }
        .panel-head h2 { font-size: 1.05rem; letter-spacing: -0.005em; }
        .panel-note { font-family: var(--mono); font-size: 0.72rem; color: var(--text-3); }

        .legend { display: flex; flex-wrap: wrap; gap: 0.35rem 1rem; font-family: var(--mono); font-size: 0.72rem; color: var(--text-2); }
        .legend span { display: inline-flex; align-items: center; gap: 0.4rem; }
        .key-line { width: 14px; height: 2px; border-radius: 1px; background: var(--accent); }
        .key-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--cool); }
        .key-sq { width: 9px; height: 9px; border-radius: 2px; }

        .chart-wrap { position: relative; width: 100%; height: clamp(220px, 30vw, 320px); }
        .chart-wrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
        .chart-tip {
            position: absolute; top: 0; left: 0; pointer-events: none; z-index: 2;
            background: var(--bg-2); border: 1px solid var(--line-2); border-radius: var(--radius-sm);
            padding: 0.4rem 0.6rem; font-family: var(--mono); font-size: 0.74rem; line-height: 1.45;
            color: var(--text-2); white-space: nowrap;
        }
        .chart-tip strong { font-weight: 500; color: var(--text); }
        .chart-tip .row { display: flex; align-items: center; gap: 0.45rem; }

        .chess-split { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 1.25rem; align-items: start; }
        .chess-side { display: grid; gap: 1.25rem; min-width: 0; }
        @media (max-width: 860px) { .chess-split { grid-template-columns: minmax(0, 1fr); } }

        /* Record bar: green / red / grey, 2px surface gap between segments */
        .record-bar { display: flex; gap: 2px; height: 14px; margin: 0.2rem 0 0.75rem; }
        .record-bar span { border-radius: 2px; min-width: 2px; }
        .record-bar .w { background: var(--ok); }
        .record-bar .l { background: var(--bad); }
        .record-bar .d { background: var(--text-3); }
        .record-bar span:first-child { border-radius: 4px 2px 2px 4px; }
        .record-bar span:last-child { border-radius: 2px 4px 4px 2px; }

        .mini-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.9rem 1rem; margin-top: 1.1rem; }
        .mini-stats .stat-num { font-family: var(--mono); font-weight: 500; font-size: 1.2rem; }

        /* Openings: thin amber bars */
        .open-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.6rem; }
        .open-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0.2rem 0.75rem; align-items: baseline; font-size: 0.9rem; }
        .open-name { color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .open-count { font-family: var(--mono); font-size: 0.82rem; color: var(--text); }
        .open-track { grid-column: 1 / -1; height: 6px; }
        .open-track span { display: block; height: 100%; background: var(--accent); border-radius: 0 3px 3px 0; min-width: 3px; }

        /* Game list */
        .games-list { list-style: none; margin: 0; padding: 0; max-height: 470px; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; }
        .game-row {
            display: grid; grid-template-columns: 1.9rem minmax(0, 1fr) auto; gap: 0.75rem; align-items: center;
            padding: 0.55rem 0.35rem; border-bottom: 1px solid var(--line); color: inherit; min-height: 44px;
        }
        .games-list li:last-child .game-row { border-bottom: 0; }
        .game-row:hover { text-decoration: none; background: var(--surface-2); }
        .result-tag { font-family: var(--mono); font-size: 0.78rem; font-weight: 500; text-align: center; border-radius: 4px; padding: 0.15rem 0; border: 1px solid; }
        .result-tag.win { color: var(--ok); border-color: var(--ok); background: var(--ok-soft); }
        .result-tag.loss { color: var(--bad); border-color: var(--bad); background: var(--bad-soft); }
        .result-tag.draw { color: var(--text-2); border-color: var(--line-2); background: var(--surface-2); }
        .game-main { min-width: 0; }
        .game-opp { display: block; color: var(--text); font-size: 0.93rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .game-meta { display: block; font-family: var(--mono); font-size: 0.7rem; color: var(--text-3); margin-top: 0.1rem; }
        .game-elo { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
        .elo-delta { display: block; font-size: 0.88rem; }
        .elo-delta.up { color: var(--ok); }
        .elo-delta.down { color: var(--bad); }
        .elo-delta.flat { color: var(--text-3); }
        .elo-after { display: block; font-size: 0.7rem; color: var(--text-3); }

        @media (hover: none) { .chart-wrap canvas { touch-action: pan-y; } }
    </style>
</head>
<body>
<main>
    <header class="page-head wrap">
        <a class="back" href="../projects.html">← Projects</a>
        <p class="kicker">Side project · Live data</p>
        <h1>Chess Rapid</h1>
        <p class="lede">A live board of my Chess.com rapid rating, form and rated games since August 1, 2026.</p>
        <div class="chess-actions">
            <a class="btn btn--ghost btn--sm" href="https://www.chess.com/member/jaybirdddd1" target="_blank" rel="noopener noreferrer">Chess.com profile: jaybirdddd1 ↗</a>
        </div>
    </header>

    <div class="wrap">
        <div class="chess-root" id="chess-root" aria-live="polite">
            <div class="chess-status">
                <span class="lamp pulse" aria-hidden="true"></span>
                <p id="chess-status">Loading rapid games from Chess.com…</p>
            </div>
        </div>
    </div>
</main>

<script>
(function () {
    const USERNAME = 'jaybirdddd1';
    const PROFILE_URL = 'https://www.chess.com/member/' + USERNAME;
    const API = 'https://api.chess.com/pub';
    // Inclusive start: Aug 1, 2026 00:00:00 UTC
    const START_TS = Math.floor(Date.UTC(2026, 7, 1) / 1000);
    const START_ARCHIVE = '2026/08';
    const root = document.getElementById('chess-root');

    function escapeHtml(str) {
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }

    async function fetchJson(url) {
        const res = await fetch(url, {
            cache: 'no-store',
            headers: { Accept: 'application/json' }
        });
        if (!res.ok) throw new Error('Request failed (' + res.status + ') for ' + url);
        return res.json();
    }

    function archiveMonthKey(url) {
        const parts = url.split('/');
        const year = parts[parts.length - 2];
        const month = parts[parts.length - 1];
        return year + '/' + month;
    }

    function isArchiveInRange(url) {
        return archiveMonthKey(url) >= START_ARCHIVE;
    }

    function parseOpening(ecoUrl) {
        if (!ecoUrl) return 'Unknown';
        const slug = ecoUrl.split('/').pop() || '';
        const cleaned = slug
            .replace(/^[A-E]\d{2}-?/, '')
            .replace(/-/g, ' ')
            .trim();
        if (!cleaned) return slug || 'Unknown';
        const short = cleaned.split(/\s+/).slice(0, 4).join(' ');
        return short.length > 36 ? short.slice(0, 34) + '…' : short;
    }

    function resultBucket(myResult) {
        if (myResult === 'win') return 'win';
        if (myResult === 'agreed' || myResult === 'repetition' || myResult === 'stalemate' ||
            myResult === 'insufficient' || myResult === 'timevsinsufficient' || myResult === '50move') {
            return 'draw';
        }
        return 'loss';
    }

    function formatDelta(n) {
        if (n == null || Number.isNaN(n)) return { text: '–', cls: 'flat' };
        if (n > 0) return { text: '+' + n, cls: 'up' };
        if (n < 0) return { text: '−' + Math.abs(n), cls: 'down' };
        return { text: '0', cls: 'flat' };
    }

    function formatDate(ts) {
        try {
            return new Intl.DateTimeFormat(undefined, {
                month: 'short', day: 'numeric', year: 'numeric'
            }).format(new Date(ts * 1000));
        } catch (_) {
            return '';
        }
    }

    function formatTimeControl(tc) {
        if (!tc) return 'Rapid';
        if (tc.includes('+')) {
            const [base, inc] = tc.split('+').map(Number);
            return Math.round(base / 60) + '|' + inc;
        }
        const secs = Number(tc);
        if (!Number.isNaN(secs)) return Math.round(secs / 60) + ' min';
        return tc;
    }

    function computeStreak(gamesDesc) {
        if (!gamesDesc.length) return { type: 'none', count: 0 };
        const first = gamesDesc[0].outcome;
        let count = 0;
        for (const g of gamesDesc) {
            if (g.outcome !== first) break;
            count += 1;
        }
        return { type: first, count: count };
    }

    function normalizeGames(rawGames) {
        const rapid = rawGames
            .filter(function (g) {
                return g.time_class === 'rapid'
                    && g.rules === 'chess'
                    && g.end_time >= START_TS;
            })
            .sort(function (a, b) { return a.end_time - b.end_time; });

        let prevRating = null;
        return rapid.map(function (g) {
            const isWhite = (g.white.username || '').toLowerCase() === USERNAME;
            const me = isWhite ? g.white : g.black;
            const opp = isWhite ? g.black : g.white;
            const ratingAfter = me.rating;
            const delta = prevRating == null ? null : ratingAfter - prevRating;
            prevRating = ratingAfter;
            const outcome = resultBucket(me.result);
            const accuracy = g.accuracies
                ? (isWhite ? g.accuracies.white : g.accuracies.black)
                : null;

            return {
                url: g.url,
                endTime: g.end_time,
                rated: g.rated !== false,
                color: isWhite ? 'White' : 'Black',
                opponent: opp.username,
                opponentRating: opp.rating,
                ratingAfter: ratingAfter,
                delta: delta,
                outcome: outcome,
                resultCode: me.result,
                timeControl: formatTimeControl(g.time_control),
                opening: parseOpening(g.eco),
                accuracy: accuracy
            };
        });
    }

    function statusBlock(message, isError) {
        return '<div class="chess-status' + (isError ? ' chess-status--error' : '') + '">' +
            '<p>' + escapeHtml(message) + '</p>' +
            '<a class="btn btn--ghost btn--sm" href="' + PROFILE_URL + '" target="_blank" rel="noopener noreferrer">Open profile on Chess.com ↗</a>' +
            '</div>';
    }

    function tile(label, value, accent) {
        return '<div class="stat' + (accent ? ' stat--accent' : '') + '">' +
            '<span class="stat-num">' + escapeHtml(String(value)) + '</span>' +
            '<span class="stat-label">' + escapeHtml(label) + '</span></div>';
    }

    function renderDashboard(profile, stats, games) {
        const rapid = stats.chess_rapid || {};
        const record = { win: 0, loss: 0, draw: 0 };
        let peak = 0;
        games.forEach(function (g) {
            record[g.outcome] += 1;
            if (g.ratingAfter > peak) peak = g.ratingAfter;
        });
        const current = (rapid.last && rapid.last.rating) || (games.length ? games[games.length - 1].ratingAfter : '–');
        if (!peak) peak = typeof current === 'number' ? current : 0;
        const total = record.win + record.loss + record.draw;
        const winRate = total ? Math.round((record.win / total) * 100) : 0;

        const gamesDesc = games.slice().reverse();
        const streak = computeStreak(gamesDesc);

        let whiteW = 0, whiteN = 0, blackW = 0, blackN = 0;
        let accSum = 0, accN = 0;
        const openings = Object.create(null);

        games.forEach(function (g) {
            if (g.color === 'White') {
                whiteN += 1;
                if (g.outcome === 'win') whiteW += 1;
            } else {
                blackN += 1;
                if (g.outcome === 'win') blackW += 1;
            }
            if (typeof g.accuracy === 'number') {
                accSum += g.accuracy;
                accN += 1;
            }
            openings[g.opening] = (openings[g.opening] || 0) + 1;
        });

        const topOpenings = Object.keys(openings)
            .map(function (k) { return { name: k, count: openings[k] }; })
            .sort(function (a, b) { return b.count - a.count; })
            .slice(0, 5);
        const maxOpening = topOpenings.length ? topOpenings[0].count : 1;

        const streakLabel = streak.type === 'win'
            ? streak.count + 'W streak'
            : streak.type === 'loss'
                ? streak.count + 'L streak'
                : streak.type === 'draw'
                    ? streak.count + 'D streak'
                    : '–';

        const league = profile && profile.league ? profile.league + ' league' : '';
        const pct = function (n) { return total ? (n / total) * 100 : 0; };

        root.innerHTML = [
            '<section class="chess-tiles" aria-label="Headline numbers">',
            '  <div class="stats">',
            tile('Rapid rating now' + (league ? ' · ' + league : ''), current, true),
            tile('Peak since Aug 1', peak),
            tile('Rated rapid games', total),
            tile('Win rate', winRate + '%'),
            tile('Current form', streakLabel),
            '  </div>',
            '</section>',

            '<section class="panel" aria-labelledby="chart-heading">',
            '  <div class="panel-head">',
            '    <h2 id="chart-heading">Rating over time</h2>',
            '    <div class="legend"><span><i class="key-line"></i>My rating after each game</span><span><i class="key-dot"></i>Opponent rating</span></div>',
            '  </div>',
            '  <div class="chart-wrap">',
            '    <canvas id="elo-chart" aria-label="Rapid rating after each game since August 1, 2026, with opponent ratings" role="img"></canvas>',
            '    <div class="chart-tip" id="elo-tooltip" hidden></div>',
            '  </div>',
            '</section>',

            '<div class="chess-split">',
            '  <section class="panel" aria-labelledby="games-heading">',
            '    <div class="panel-head">',
            '      <h2 id="games-heading">Game history</h2>',
            '      <span class="panel-note">Newest first · ' + total + ' games</span>',
            '    </div>',
            '    <ul class="games-list" id="games-list">',
            gamesDesc.map(function (g) {
                const d = formatDelta(g.delta);
                return [
                    '<li>',
                    '<a class="game-row" href="' + escapeHtml(g.url) + '" target="_blank" rel="noopener noreferrer">',
                    '  <span class="result-tag ' + g.outcome + '" aria-label="' + g.outcome + '">' + (g.outcome === 'win' ? 'W' : g.outcome === 'loss' ? 'L' : 'D') + '</span>',
                    '  <span class="game-main">',
                    '    <span class="game-opp">vs ' + escapeHtml(g.opponent) + ' <span class="muted mono small">(' + escapeHtml(String(g.opponentRating)) + ')</span></span>',
                    '    <span class="game-meta">' + escapeHtml(g.color) + ' · ' + escapeHtml(g.timeControl) + ' · ' + escapeHtml(formatDate(g.endTime)) + '</span>',
                    '  </span>',
                    '  <span class="game-elo">',
                    '    <span class="elo-delta ' + d.cls + '">' + escapeHtml(d.text) + '</span>',
                    '    <span class="elo-after">' + escapeHtml(String(g.ratingAfter)) + '</span>',
                    '  </span>',
                    '</a>',
                    '</li>'
                ].join('');
            }).join(''),
            '    </ul>',
            '  </section>',

            '  <div class="chess-side">',
            '    <section class="panel" aria-labelledby="record-heading">',
            '      <div class="panel-head"><h2 id="record-heading">Record</h2><span class="panel-note">Since Aug 1, 2026</span></div>',
            '      <div class="record-bar" role="img" aria-label="' + record.win + ' wins, ' + record.loss + ' losses, ' + record.draw + ' draws">',
            (record.win ? '<span class="w" style="flex:' + pct(record.win) + '"></span>' : ''),
            (record.loss ? '<span class="l" style="flex:' + pct(record.loss) + '"></span>' : ''),
            (record.draw ? '<span class="d" style="flex:' + pct(record.draw) + '"></span>' : ''),
            '      </div>',
            '      <div class="legend">',
            '        <span><i class="key-sq" style="background:var(--ok)"></i>' + record.win + ' wins</span>',
            '        <span><i class="key-sq" style="background:var(--bad)"></i>' + record.loss + ' losses</span>',
            '        <span><i class="key-sq" style="background:var(--text-3)"></i>' + record.draw + ' draws</span>',
            '      </div>',
            '      <div class="mini-stats">',
            '        <div class="stat"><span class="stat-num">' + (whiteN ? Math.round((whiteW / whiteN) * 100) : 0) + '%</span><span class="stat-label">Won as White<br>' + whiteW + ' of ' + whiteN + '</span></div>',
            '        <div class="stat"><span class="stat-num">' + (blackN ? Math.round((blackW / blackN) * 100) : 0) + '%</span><span class="stat-label">Won as Black<br>' + blackW + ' of ' + blackN + '</span></div>',
            '        <div class="stat"><span class="stat-num">' + (accN ? (accSum / accN).toFixed(1) : '–') + '</span><span class="stat-label">Avg accuracy<br>' + (accN ? accN + ' games' : 'no data yet') + '</span></div>',
            '      </div>',
            '    </section>',

            '    <section class="panel" aria-labelledby="openings-heading">',
            '      <div class="panel-head">',
            '        <h2 id="openings-heading">Openings</h2>',
            '        <span class="panel-note">Top 5 by games played</span>',
            '      </div>',
            '      <ul class="open-list">',
            topOpenings.map(function (o) {
                return '<li class="open-row"><span class="open-name">' + escapeHtml(o.name) + '</span><span class="open-count">' + o.count + '</span>' +
                    '<span class="open-track"><span style="width:' + ((o.count / maxOpening) * 100).toFixed(1) + '%"></span></span></li>';
            }).join('') || '<li class="open-row"><span class="open-name">No opening data yet</span></li>',
            '      </ul>',
            '    </section>',
            '  </div>',
            '</div>'
        ].join('');

        drawEloChart(games);
    }

    function drawEloChart(games) {
        const canvas = document.getElementById('elo-chart');
        const tooltip = document.getElementById('elo-tooltip');
        if (!canvas || !games.length) return;

        const css = getComputedStyle(document.documentElement);
        const C = {
            accent: css.getPropertyValue('--accent').trim() || '#f0b246',
            cool: css.getPropertyValue('--cool').trim() || '#6ea8fe',
            surface: css.getPropertyValue('--surface').trim() || '#141922',
            grid: css.getPropertyValue('--line').trim() || '#252c38',
            axis: css.getPropertyValue('--line-2').trim() || '#3a4454',
            label: css.getPropertyValue('--text-3').trim() || '#7c8697',
            mono: css.getPropertyValue('--mono').trim() || 'monospace'
        };

        const ctx = canvas.getContext('2d');
        const points = games.map(function (g) {
            return { x: g.endTime, y: g.ratingAfter, opp: g.opponentRating, g: g, label: formatDate(g.endTime) };
        });

        let hoverIndex = -1;

        function resize() {
            const wrap = canvas.parentElement;
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            const w = wrap.clientWidth;
            const h = wrap.clientHeight;
            canvas.width = Math.floor(w * dpr);
            canvas.height = Math.floor(h * dpr);
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            paint();
        }

        function paint() {
            const w = canvas.clientWidth;
            const h = canvas.clientHeight;
            const pad = { t: 10, r: 12, b: 26, l: 42 };
            const plotW = w - pad.l - pad.r;
            const plotH = h - pad.t - pad.b;

            ctx.clearRect(0, 0, w, h);

            const ys = [];
            points.forEach(function (p) {
                ys.push(p.y);
                if (typeof p.opp === 'number') ys.push(p.opp);
            });
            let minY = Math.min.apply(null, ys);
            let maxY = Math.max.apply(null, ys);
            const padY = Math.max(20, Math.round((maxY - minY) * 0.1) || 20);
            minY = Math.floor((minY - padY) / 50) * 50;
            maxY = Math.ceil((maxY + padY) / 50) * 50;
            if (minY === maxY) { minY -= 50; maxY += 50; }

            const minX = points[0].x;
            const maxX = points[points.length - 1].x;
            const spanX = Math.max(maxX - minX, 1);

            function toX(t) { return points.length === 1 ? pad.l + plotW / 2 : pad.l + ((t - minX) / spanX) * plotW; }
            function toY(v) { return pad.t + (1 - (v - minY) / (maxY - minY)) * plotH; }

            // Gridlines + y labels
            ctx.lineWidth = 1;
            ctx.font = '11px ' + C.mono;
            ctx.fillStyle = C.label;
            ctx.textAlign = 'right';
            ctx.textBaseline = 'middle';
            const steps = 4;
            for (let i = 0; i <= steps; i++) {
                const v = minY + ((maxY - minY) * i) / steps;
                const y = Math.round(toY(v)) + 0.5;
                ctx.strokeStyle = i === 0 ? C.axis : C.grid;
                ctx.beginPath();
                ctx.moveTo(pad.l, y);
                ctx.lineTo(w - pad.r, y);
                ctx.stroke();
                ctx.fillText(String(Math.round(v)), pad.l - 8, y);
            }

            // Month ticks along the x axis
            ctx.textAlign = 'center';
            ctx.textBaseline = 'top';
            const d0 = new Date(minX * 1000);
            let m = new Date(Date.UTC(d0.getUTCFullYear(), d0.getUTCMonth(), 1));
            while (m.getTime() / 1000 <= maxX) {
                const t = m.getTime() / 1000;
                if (t >= minX) {
                    const x = toX(t);
                    let label = '';
                    try { label = new Intl.DateTimeFormat(undefined, { month: 'short', timeZone: 'UTC' }).format(m); } catch (_) { label = ''; }
                    ctx.strokeStyle = C.axis;
                    ctx.beginPath();
                    ctx.moveTo(Math.round(x) + 0.5, h - pad.b);
                    ctx.lineTo(Math.round(x) + 0.5, h - pad.b + 4);
                    ctx.stroke();
                    if (x > pad.l + 14 && x < w - pad.r - 14) ctx.fillText(label, x, h - pad.b + 7);
                }
                m = new Date(Date.UTC(m.getUTCFullYear(), m.getUTCMonth() + 1, 1));
            }

            // Hover crosshair
            if (hoverIndex >= 0) {
                const hx = Math.round(toX(points[hoverIndex].x)) + 0.5;
                ctx.strokeStyle = C.axis;
                ctx.beginPath();
                ctx.moveTo(hx, pad.t);
                ctx.lineTo(hx, h - pad.b);
                ctx.stroke();
            }

            // Opponent ratings: secondary series, small blue dots
            ctx.globalAlpha = 0.55;
            ctx.fillStyle = C.cool;
            points.forEach(function (p) {
                if (typeof p.opp !== 'number') return;
                ctx.beginPath();
                ctx.arc(toX(p.x), toY(p.opp), 2.25, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;

            // Area wash under my rating
            ctx.beginPath();
            points.forEach(function (p, i) {
                const x = toX(p.x), y = toY(p.y);
                if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            });
            ctx.lineTo(toX(points[points.length - 1].x), h - pad.b);
            ctx.lineTo(toX(points[0].x), h - pad.b);
            ctx.closePath();
            ctx.globalAlpha = 0.1;
            ctx.fillStyle = C.accent;
            ctx.fill();
            ctx.globalAlpha = 1;

            // My rating line
            ctx.beginPath();
            points.forEach(function (p, i) {
                const x = toX(p.x), y = toY(p.y);
                if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            });
            ctx.strokeStyle = C.accent;
            ctx.lineWidth = 2;
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';
            ctx.stroke();

            // End dot, plus the hovered game, each with a surface ring
            function dot(p, color, r) {
                ctx.beginPath();
                ctx.arc(toX(p.x), toY(p.y), r + 2, 0, Math.PI * 2);
                ctx.fillStyle = C.surface;
                ctx.fill();
                ctx.beginPath();
                ctx.arc(toX(p.x), toY(p.y), r, 0, Math.PI * 2);
                ctx.fillStyle = color;
                ctx.fill();
            }
            dot(points[points.length - 1], C.accent, 4);
            if (hoverIndex >= 0) {
                const hp = points[hoverIndex];
                if (typeof hp.opp === 'number') {
                    ctx.beginPath();
                    ctx.arc(toX(hp.x), toY(hp.opp), 6, 0, Math.PI * 2);
                    ctx.fillStyle = C.surface;
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(toX(hp.x), toY(hp.opp), 4, 0, Math.PI * 2);
                    ctx.fillStyle = C.cool;
                    ctx.fill();
                }
                dot(hp, C.accent, 4.5);
            }

            canvas._chartMeta = { points: points, toX: toX, toY: toY, pad: pad, plotW: plotW, w: w };
        }

        function showTip(p) {
            const d = formatDelta(p.g.delta);
            tooltip.textContent = '';
            const head = document.createElement('div');
            head.className = 'muted';
            head.textContent = p.label + ' · ' + p.g.outcome;
            const r1 = document.createElement('div');
            r1.className = 'row';
            r1.innerHTML = '<i class="key-line"></i><strong></strong><span></span>';
            r1.querySelector('strong').textContent = String(p.y);
            r1.querySelector('span').textContent = '(' + d.text + ')';
            const r2 = document.createElement('div');
            r2.className = 'row';
            r2.innerHTML = '<i class="key-dot"></i><strong></strong><span></span>';
            r2.querySelector('strong').textContent = String(p.opp);
            r2.querySelector('span').textContent = p.g.opponent;
            tooltip.appendChild(head);
            tooltip.appendChild(r1);
            tooltip.appendChild(r2);
        }

        function onMove(e) {
            const meta = canvas._chartMeta;
            if (!meta) return;
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            let best = -1;
            let bestDist = Infinity;
            meta.points.forEach(function (p, i) {
                const dx = Math.abs(meta.toX(p.x) - x);
                if (dx < bestDist) { bestDist = dx; best = i; }
            });
            if (bestDist > 36) { onLeave(); return; }
            hoverIndex = best;
            const p = meta.points[best];
            showTip(p);
            tooltip.hidden = false;
            const px = meta.toX(p.x);
            const tw = tooltip.offsetWidth;
            const left = Math.max(0, Math.min(meta.w - tw, px + 12 > meta.w - tw ? px - tw - 12 : px + 12));
            tooltip.style.transform = 'translate(' + left + 'px,' + Math.max(0, meta.toY(p.y) - 70) + 'px)';
            paint();
        }

        function onLeave() {
            hoverIndex = -1;
            tooltip.hidden = true;
            paint();
        }

        resize();
        let t = null;
        window.addEventListener('resize', function () { clearTimeout(t); t = setTimeout(resize, 120); });
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(paint);
        canvas.addEventListener('pointermove', onMove);
        canvas.addEventListener('pointerleave', onLeave);
    }

    async function loadAll() {
        try {
            const [profile, stats, archivesPayload] = await Promise.all([
                fetchJson(API + '/player/' + USERNAME),
                fetchJson(API + '/player/' + USERNAME + '/stats'),
                fetchJson(API + '/player/' + USERNAME + '/games/archives')
            ]);

            const archives = (archivesPayload.archives || []).filter(isArchiveInRange);
            const months = await Promise.all(archives.map(function (url) {
                return fetchJson(url).catch(function () { return { games: [] }; });
            }));

            const allGames = [];
            months.forEach(function (m) {
                if (m.games && m.games.length) {
                    allGames.push.apply(allGames, m.games);
                }
            });

            const rapidGames = normalizeGames(allGames);
            if (!rapidGames.length) {
                root.innerHTML = statusBlock('No rated rapid games since August 1, 2026 yet.', false);
                return;
            }

            renderDashboard(profile, stats, rapidGames);
        } catch (err) {
            console.warn(err);
            root.innerHTML = statusBlock('Couldn’t load Chess.com data right now. The API may be briefly unavailable. Refresh to try again, or see my games on Chess.com.', true);
        }
    }

    loadAll();
})();
</script>
</body>
</html>
